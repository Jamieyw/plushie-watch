name: plushie-watch

on:
  # GitHub's scheduler is degraded (runs every few hours), so this is only a backup.
  # The real 5-minute timer is cron-job.org calling the workflow_dispatch API.
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test push instead of checking"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency: plushie-watch

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check claude.dev swag
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PLUSHIE_LOG: /tmp/watch.log
        run: python3 watch.py ${{ inputs.test_notify && '--test-notify' || '' }}

      - name: Save state if it changed
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "plushie-watch"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "Update swag state"
            git push
          fi

      # GitHub pauses scheduled workflows after 60 days without repo activity, and a
      # disabled workflow also rejects the cron-job.org dispatches. Re-enabling resets
      # that timer; runs on every trigger but only acts monthly.
      - name: Keep workflow alive
        if: ${{ !inputs.test_notify }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wf="repos/${{ github.repository }}/actions/workflows/watch.yml"
          updated=$(gh api "$wf" --jq .updated_at)
          age_days=$(( ($(date +%s) - $(date -d "$updated" +%s)) / 86400 ))
          echo "workflow last re-enabled/updated $age_days days ago"
          if [ "$age_days" -ge 30 ]; then gh api -X PUT "$wf/enable"; fi
